[package]
name = "purepath-dns"
version = "0.1.0"
description = "Pure Path system-level DNS filtering (plan 1.1/1.2): a dependency-free UDP+TCP forwarding proxy that NXDOMAINs blocked/DoH domains and relays everything else to the adapter's real upstream resolvers."
edition = "2021"
rust-version = "1.77.2"

# Deliberately no hickory-dns / trust-dns (lead decision — nothing here can be
# compile-checked before the owner builds it, so a large unfamiliar dependency
# is unacceptable risk). std::net only, plus the same shared matching engine
# the desktop app and native host already use.
[dependencies]
purepath-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
