[package]
name = "pure-path-host"
version = "0.1.0"
description = "Chrome Native Messaging host for Pure Path"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "pure-path-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"

# Release profile (opt-level="s" + lto/strip) moved to the workspace root
# Cargo.toml (A.1) — Cargo ignores `[profile.*]` in non-root members. See the
# comment there for the small lto/strip deviation this move causes.
