[package]
name = "pure-path-host"
version = "0.1.0"
description = "Chrome Native Messaging host for Pure Path"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "pure-path-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
