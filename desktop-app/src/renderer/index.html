<!DOCTYPE html>
<!-- Noir is the only built-in theme and the default (UX Direction §7) — the
     old palette variants are gone; user-custom colors are runtime token
     overrides applied on top of Noir by the Themes page. -->
<html lang="en" data-theme="dark" data-style="noir">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oath Light</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <script src="lib/react.production.min.js"></script>
  <script src="lib/react-dom.production.min.js"></script>
  <script src="lib/babel.min.js"></script>

  <!-- Voice layer (UX Direction §2) — byte-identical copy of
       design-system/strings.js, loaded before the store so PP.t() can
       delegate to it from the first render. -->
  <script src="strings.js"></script>
  <!-- Locale tables register themselves onto OL_STRINGS. Plain scripts, no
       build step — see the Locales block in strings.js. One line per shipped
       language; keep in step with extension/manifest.json's background.scripts. -->
  <script src="locales/ar.js"></script>
  <!-- Token metadata manifest (names/groups/types, no values) — the Themes
       page builds its custom-color editor from it. Byte-identical copy of
       design-system/tokens.js. -->
  <script src="tokens.js"></script>
  <script src="js/store.js"></script>
  <script type="text/babel" data-presets="react" src="js/tauri-bridge.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/icons.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/ui.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/bg.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/shell.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/pages-overview.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/pages-blocklist.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/pages-blocking.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/pages-mentor.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/pages-tips.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/pages-themes.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/pages-settings.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/pages-panic.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/pages-onboarding.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/app.jsx"></script>
</body>
</html>
