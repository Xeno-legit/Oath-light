<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">
  <title>Pure Path — Sanctuary</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Three.js Fluid Background -->
  <canvas id="fluid-canvas"></canvas>

  <!-- Custom Title Bar -->
  <div class="title-bar">
    <div class="title-bar-brand">
      <img src="assets/icon48.png" alt="Logo" class="title-bar-logo">
      <span class="title-bar-text">Pure Path</span>
    </div>
    <div class="window-controls">
      <button class="window-btn" id="btn-minimize" title="Minimize">
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="window-btn" id="btn-maximize" title="Maximize">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
      <button class="window-btn close" id="btn-close" title="Close">
        <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
    </div>
  </div>

  <!-- App Shell -->
  <div class="app-shell">

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar" id="sidebar">
      <!-- App Logo -->
      <div class="sidebar-logo" id="sidebar-logo">
        <img src="assets/icon48.png" alt="Pure Path">
      </div>

      <!-- Main Navigation -->
      <nav class="sidebar-nav">
        <button class="sidebar-item active" data-page="overview" id="nav-overview">
          <span class="sidebar-item-icon">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </span>
          <span class="sidebar-item-label">Overview</span>
        </button>
        <button class="sidebar-item" data-page="blocking" id="nav-blocking">
          <span class="sidebar-item-icon">
            <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </span>
          <span class="sidebar-item-label">Blocking</span>
        </button>
        <button class="sidebar-item" data-page="mentor" id="nav-mentor">
          <span class="sidebar-item-icon">
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </span>
          <span class="sidebar-item-label">Mentor</span>
        </button>
      </nav>

      <div class="sidebar-divider"></div>

      <!-- Bottom anchored: Identity Hub -->
      <div class="sidebar-bottom">
        <button class="sidebar-item" data-page="themes" id="nav-themes">
          <span class="sidebar-item-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 4.2c.57.42.9 1.09.9 1.81v9.6c0 1.1-.9 2-2 2H7.44c-1.1 0-2-.9-2-2v-9.6c0-.72.33-1.39.9-1.81L12 2.69z"/><path d="M12 22v-8"/></svg>
          </span>
          <span class="sidebar-item-label">Themes</span>
        </button>
        <button class="sidebar-item" data-page="settings" id="nav-settings">
          <span class="sidebar-item-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </span>
          <span class="sidebar-item-label">Settings</span>
        </button>
        <button class="sidebar-item" data-page="account" id="nav-account">
          <span class="sidebar-item-icon">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <span class="sidebar-item-label">Account</span>
        </button>
      </div>
    </aside>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main class="main-content" id="main-content">

      <!-- OVERVIEW PAGE -->
      <section id="page-overview" class="page-view active"></section>

      <!-- BLOCKING MANAGER PAGE -->
      <section id="page-blocking" class="page-view"></section>

      <!-- MENTOR PAGE -->
      <section id="page-mentor" class="page-view"></section>

      <!-- SETTINGS PAGE -->
      <section id="page-settings" class="page-view"></section>

      <!-- ACCOUNT PAGE -->
      <section id="page-account" class="page-view"></section>

      <!-- THEMES PAGE -->
      <section id="page-themes" class="page-view"></section>

    </main>
  </div>

  <!-- Modal Container -->
  <div id="modal-root"></div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- App Scripts -->
  <script src="js/fluid-bg.js"></script>
  <script src="js/gsap-transitions.js"></script>
  <script src="js/pages/overview.js"></script>
  <script src="js/pages/blocking.js"></script>
  <script src="js/pages/mentor.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/account.js"></script>
  <script src="js/pages/themes.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
