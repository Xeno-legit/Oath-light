<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Path</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══ Pure Path — Fresh Dawn Theme ═══ */
    :root {
      --bg-primary: #FAFAF9;
      --bg-secondary: #FFFFFF;
      --bg-accent: #F5F5F4;
      --accent-primary: #0D9488;
      --accent-secondary: #14B8A6;
      --accent-warm: #F97316;
      --accent-gradient: linear-gradient(135deg, #0D9488, #14B8A6);
      --text-primary: #1C1917;
      --text-secondary: #44403C;
      --text-muted: #78716C;
      --border-subtle: rgba(0, 0, 0, 0.06);
      --border-focus: rgba(13, 148, 136, 0.3);
      --shadow-soft: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-medium: 0 4px 16px rgba(0, 0, 0, 0.06);
      --shadow-strong: 0 8px 32px rgba(0, 0, 0, 0.08);
      --success: #059669;
      --danger: #DC2626;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 375px;
      height: 580px;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(13, 148, 136, 0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(13, 148, 136, 0.4); }

    /* ─── Subtle Background Pattern ─── */
    .bg-pattern {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(13, 148, 136, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(249, 115, 22, 0.03) 0%, transparent 50%);
    }

    /* ─── App Container ─── */
    .app-container {
      position: relative;
      z-index: 10;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0 24px 24px 24px;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0 20px 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--bg-secondary);
      box-shadow: var(--shadow-soft);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo img {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .header-title h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .header-version {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* ─── Status Banner ─── */
    .status-banner {
      background: var(--accent-gradient);
      border-radius: 20px;
      padding: 24px 28px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(13, 148, 136, 0.25);
    }
    .status-banner::before {
      content: '';
      position: absolute;
      top: -50%; right: -30%;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .pulse-dot {
      position: relative;
      width: 10px; height: 10px;
    }
    .pulse-inner {
      position: absolute;
      width: 100%; height: 100%;
      background: #fff;
      border-radius: 50%;
    }
    .pulse-ring {
      position: absolute;
      width: 100%; height: 100%;
      background: #fff;
      border-radius: 50%;
      animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(3.5); opacity: 0; }
    }
    .status-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.9);
    }
    .status-title {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .status-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      font-weight: 400;
    }

    /* ─── Stats Grid ─── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px 18px;
      box-shadow: var(--shadow-soft);
      transition: all 0.25s ease;
    }
    .stat-card:hover {
      box-shadow: var(--shadow-medium);
      transform: translateY(-2px);
    }
    .stat-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .stat-icon.blue {
      background: rgba(13, 148, 136, 0.1);
      color: var(--accent-primary);
    }
    .stat-icon.orange {
      background: rgba(249, 115, 22, 0.1);
      color: var(--accent-warm);
    }
    .stat-icon svg {
      width: 20px; height: 20px;
      stroke: currentColor; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .stat-value {
      font-size: 30px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 1;
    }
    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* ─── Quote Card ─── */
    .quote-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: var(--shadow-soft);
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 18px;
      transition: all 0.25s ease;
    }
    .quote-card:hover {
      box-shadow: var(--shadow-medium);
    }
    .quote-icon {
      color: var(--accent-primary);
      opacity: 0.3;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .quote-icon svg {
      width: 20px; height: 20px;
      stroke: currentColor; stroke-width: 2;
      fill: none;
    }
    .quote-text {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-style: italic;
    }
    .quote-author {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-primary);
    }

    /* ─── Action Button ─── */
    .action-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: all 0.25s ease;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
    }
    .action-btn:hover {
      border-color: var(--border-focus);
      box-shadow: var(--shadow-medium);
      transform: translateX(4px);
    }
    .action-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .action-icon {
      width: 38px; height: 38px;
      background: rgba(13, 148, 136, 0.1);
      color: var(--accent-primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .action-icon svg, .action-arrow svg {
      width: 19px; height: 19px;
      stroke: currentColor; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .action-arrow {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <!-- Background Pattern -->
  <div class="bg-pattern"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <img src="icons/Main_logo.png" alt="Pure Path">
        </div>
        <div>
          <h1 class="header-title">Pure Path</h1>
          <span class="header-version">Web Shield v2.4</span>
        </div>
      </div>
    </header>

    <!-- Status Banner -->
    <div class="status-banner">
      <div class="status-badge">
        <div class="pulse-dot">
          <div class="pulse-ring"></div>
          <div class="pulse-inner"></div>
        </div>
        <span class="status-label">System Secure</span>
      </div>
      <h2 class="status-title">Protection Active</h2>
      <p class="status-subtitle">Monitoring network traffic</p>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon blue">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </div>
        <div class="stat-value" id="totalBlocks">0</div>
        <div class="stat-label">Sites Blocked</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>
        <div class="stat-value" id="daysProtected">0</div>
        <div class="stat-label">Days Protected</div>
      </div>
    </div>

    <!-- Quote -->
    <div class="quote-card">
      <div class="quote-icon">
        <svg viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"></path></svg>
      </div>
      <div>
        <p class="quote-text" id="quoteText">"Focus on being productive instead of busy."</p>
        <p class="quote-author" id="quoteAuthor">Tim Ferriss</p>
      </div>
    </div>

    <!-- Action -->
    <button class="action-btn" id="viewBlocklistsBtn">
      <div class="action-left">
        <div class="action-icon">
          <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </div>
        Manage Blocklists
      </div>
      <div class="action-arrow">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
