<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Path</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══ Pure Path — Unified Theme ═══ */
    :root {
      --pp-bg-deep: #0B0E14;
      --pp-bg-surface: #10141E;
      --pp-bg-elevated: #171D2B;
      --pp-accent-blue: #3B82F6;
      --pp-accent-purple: #A78BFA;
      --pp-accent-glow: rgba(59, 130, 246, 0.25);
      --pp-gradient: linear-gradient(135deg, #3B82F6, #A78BFA);
      --pp-text: #F1F5F9;
      --pp-text-muted: #94A3B8;
      --pp-text-dim: #64748B;
      --pp-border: rgba(59, 130, 246, 0.10);
      --pp-border-hover: rgba(59, 130, 246, 0.25);
      --pp-success: #10B981;
      --pp-danger: #EF4444;
      --pp-glass: rgba(16, 20, 30, 0.55);
      --pp-glass-solid: rgba(16, 20, 30, 0.85);
      --pp-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 375px;
      height: 580px;
      background: var(--pp-bg-deep);
      color: var(--pp-text);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.4); }

    /* ─── Ambient Background ─── */
    .ambient-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      will-change: transform;
    }
    .orb-1 {
      width: 280px; height: 280px;
      background: rgba(59, 130, 246, 0.15);
      top: -80px; right: -80px;
      animation: drift-1 22s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 220px; height: 220px;
      background: rgba(167, 139, 250, 0.10);
      bottom: 30px; left: -60px;
      animation: drift-2 26s ease-in-out infinite alternate;
    }
    @keyframes drift-1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-30px, 40px) scale(1.08); }
    }
    @keyframes drift-2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, -35px) scale(1.05); }
    }

    /* ─── App Container ─── */
    .app-container {
      position: relative;
      z-index: 10;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0 20px 24px 20px;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px 0;
      animation: fade-down 0.5s ease-out;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--pp-bg-surface);
      border: 1px solid var(--pp-border);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo img {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .header-title h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--pp-text);
    }
    .header-version {
      font-size: 11px;
      font-weight: 500;
      color: var(--pp-text-dim);
      letter-spacing: 0.02em;
    }
    @keyframes fade-down {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Status Banner ─── */
    .status-banner {
      background: var(--pp-gradient);
      border-radius: 16px;
      padding: 22px 24px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      animation: slide-up 0.5s ease-out 0.1s both;
    }
    .status-banner::before {
      content: '';
      position: absolute;
      top: -50%; right: -30%;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    /* Shimmer sweep */
    .status-banner::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      animation: shimmer 4s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { left: -100%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .pulse-dot {
      position: relative;
      width: 8px; height: 8px;
    }
    .pulse-inner {
      position: absolute;
      width: 100%; height: 100%;
      background: #fff;
      border-radius: 50%;
    }
    .pulse-ring {
      position: absolute;
      width: 100%; height: 100%;
      background: #fff;
      border-radius: 50%;
      animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(3.5); opacity: 0; }
    }
    .status-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.85);
    }
    .status-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 3px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .status-subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      font-weight: 400;
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Stats Grid ─── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
      animation: slide-up 0.5s ease-out 0.2s both;
    }
    .stat-card {
      background: var(--pp-glass);
      border: 1px solid var(--pp-border);
      border-radius: 14px;
      padding: 18px 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.3s ease;
    }
    .stat-card:hover {
      border-color: var(--pp-border-hover);
    }
    .stat-icon {
      width: 32px; height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .stat-icon.blue {
      background: rgba(59, 130, 246, 0.12);
      color: var(--pp-accent-blue);
    }
    .stat-icon.purple {
      background: rgba(167, 139, 250, 0.12);
      color: var(--pp-accent-purple);
    }
    .stat-icon svg {
      width: 18px; height: 18px;
      stroke: currentColor; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--pp-text);
      margin-bottom: 2px;
      line-height: 1;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--pp-text-muted);
      letter-spacing: 0.01em;
    }

    /* ─── Quote Card ─── */
    .quote-card {
      background: var(--pp-glass);
      border: 1px solid var(--pp-border);
      border-radius: 14px;
      padding: 18px 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 16px;
      animation: slide-up 0.5s ease-out 0.3s both;
      transition: border-color 0.3s ease;
    }
    .quote-card:hover {
      border-color: var(--pp-border-hover);
    }
    .quote-icon {
      color: var(--pp-accent-purple);
      opacity: 0.4;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .quote-icon svg {
      width: 18px; height: 18px;
      stroke: currentColor; stroke-width: 2;
      fill: none;
    }
    .quote-text {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--pp-text);
      margin-bottom: 6px;
      font-style: italic;
    }
    .quote-author {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--pp-accent-blue);
    }

    /* ─── Action Button ─── */
    .action-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: var(--pp-glass);
      border: 1px solid var(--pp-border);
      border-radius: 14px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      color: var(--pp-text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      animation: slide-up 0.5s ease-out 0.4s both;
    }
    .action-btn:hover {
      border-color: var(--pp-border-hover);
      transform: translateX(3px);
      background: rgba(59, 130, 246, 0.04);
    }
    .action-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .action-icon {
      width: 34px; height: 34px;
      background: rgba(59, 130, 246, 0.10);
      color: var(--pp-accent-blue);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .action-icon svg, .action-arrow svg {
      width: 18px; height: 18px;
      stroke: currentColor; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .action-arrow {
      color: var(--pp-text-dim);
    }
  </style>
</head>
<body>
  <!-- Ambient Background -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <img src="icons/Main_logo.png" alt="Pure Path">
        </div>
        <div>
          <h1 class="header-title">Pure Path</h1>
          <span class="header-version">Web Shield v2.4</span>
        </div>
      </div>
    </header>

    <!-- Status Banner -->
    <div class="status-banner">
      <div class="status-badge">
        <div class="pulse-dot">
          <div class="pulse-ring"></div>
          <div class="pulse-inner"></div>
        </div>
        <span class="status-label">System Secure</span>
      </div>
      <h2 class="status-title">Protection Active</h2>
      <p class="status-subtitle">Monitoring network traffic</p>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon blue">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </div>
        <div class="stat-value" id="totalBlocks">0</div>
        <div class="stat-label">Sites Blocked</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>
        <div class="stat-value" id="daysProtected">0</div>
        <div class="stat-label">Days Protected</div>
      </div>
    </div>

    <!-- Quote -->
    <div class="quote-card">
      <div class="quote-icon">
        <svg viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"></path></svg>
      </div>
      <div>
        <p class="quote-text" id="quoteText">"Focus on being productive instead of busy."</p>
        <p class="quote-author" id="quoteAuthor">Tim Ferriss</p>
      </div>
    </div>

    <!-- Action -->
    <button class="action-btn" id="viewBlocklistsBtn">
      <div class="action-left">
        <div class="action-icon">
          <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </div>
        Manage Blocklists
      </div>
      <div class="action-arrow">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
