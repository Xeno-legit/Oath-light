<!DOCTYPE html>
<html lang="en" data-theme="dark" data-style="aurora" data-bg="both">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Blocked — Oath Light</title>
  <!-- shared design system: theme tokens (6 palettes × light/dark), glass primitives, animated bg -->
  <link rel="stylesheet" href="blocklist_assets/tokens.css">
  <link rel="stylesheet" href="blocklist_assets/desktop.css">
  <style>
    /* ---- blocked page layout (page-specific; tokens come from desktop.css) ---- */
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; overflow: hidden;
      background: var(--desktop);
    }

    /* full-viewport background canvas (desktop.css .bg is absolute → make it fixed here) */
    .bg { position: fixed; inset: 0; z-index: 0; }
    svg.svgi { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .blocked-card {
      position: relative; z-index: 2;
      width: 100%; max-width: 560px;
      padding: 48px 46px 44px;
      text-align: center;
      background: var(--glass);
      border: 1px solid var(--glass-brd);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px);
      animation: slideUpFade .7s var(--ease) both;
    }
    @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }

    /* status pill — mirrors the desktop titlebar .tl-status */
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 0 auto 26px;
      font-size: 12px; font-weight: 700; letter-spacing: .04em;
      color: var(--text-2);
      padding: 6px 14px; border-radius: 999px;
      background: var(--glass-2); border: 1px solid var(--glass-brd);
    }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent-2) 70%, transparent);
      animation: statusPulse 2.6s var(--ease-soft) infinite;
    }
    @keyframes statusPulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent-2) 55%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

    .shield {
      width: 92px; height: 92px; margin: 0 auto 26px;
      border-radius: 26px; display: grid; place-items: center;
      background: color-mix(in oklab, var(--accent) 16%, transparent);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--glass-brd), 0 18px 40px -22px color-mix(in oklab, var(--accent) 90%, transparent);
      animation: gentlePulse 4.5s var(--ease-soft) infinite;
    }
    .shield img { width: 54px; height: 54px; display: block; }
    @keyframes gentlePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    h1 { font-size: 38px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin-bottom: 12px; }

    .reason {
      color: var(--text-2); font-size: 16px; font-weight: 600;
      margin-bottom: 26px; line-height: 1.5;
    }

    /* quote — mirrors the popup quote (serif mark + text + author) */
    .quote {
      position: relative;
      background: var(--glass-2);
      border: 1px solid var(--glass-brd);
      border-left: 4px solid var(--accent);
      padding: 22px 24px 22px 56px; margin: 26px 0;
      border-radius: var(--r-md);
      text-align: left; cursor: pointer; overflow: hidden;
      transition: border-color .25s, background .25s, transform .2s var(--ease);
    }
    .quote:hover { border-color: var(--glass-brd-strong); background: color-mix(in oklab, var(--accent) 7%, var(--glass-2)); }
    .quote:active { transform: scale(.99); }
    .quote-mark {
      font-family: var(--font-display); font-size: 60px; line-height: .6;
      color: color-mix(in oklab, var(--accent) 55%, transparent);
      position: absolute; top: 26px; left: 18px; pointer-events: none;
    }
    .quote-text {
      color: var(--text); font-size: 15.5px; font-weight: 500; line-height: 1.6;
      text-wrap: pretty; transition: opacity .3s var(--ease);
    }
    .quote-author {
      font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--accent); margin-top: 12px; transition: opacity .3s var(--ease);
    }

    .stats {
      display: flex; gap: 14px;
      margin: 26px 0; padding: 22px;
      background: var(--glass-2);
      border: 1px solid var(--glass-brd);
      border-radius: var(--r-lg);
    }
    .stat { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .stat + .stat { border-left: 1px solid var(--glass-brd); }
    .stat-ico {
      width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
      background: color-mix(in oklab, var(--accent) 15%, transparent); color: var(--accent);
      margin-bottom: 2px;
    }
    .stat-ico svg { width: 20px; height: 20px; }
    .stat-value {
      font-size: 38px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-label {
      font-size: 12px; color: var(--muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
    }

    .message { color: var(--muted); line-height: 1.6; font-size: 15px; font-weight: 500; margin-bottom: 34px; }

    .safe-btn { padding: 16px 36px; font-size: 16px; border-radius: var(--r-md); }
    .safe-btn svg { width: 20px; height: 20px; }

    @media (max-width: 520px) {
      .blocked-card { padding: 38px 24px 34px; }
      h1 { font-size: 30px; }
      .stat-value { font-size: 30px; }
      .stats { flex-direction: column; gap: 18px; }
      .stat + .stat { border-left: none; border-top: 1px solid var(--glass-brd); padding-top: 18px; }
    }

    /* ---- Panic / SOS urge-surfing flow (plan 5.1; driven by blocked.js) ---- */
    .panic-btn { margin-top: 12px; }
    .panic-overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; overflow-y: auto;
      background: color-mix(in oklab, var(--bg-0) 74%, transparent);
      -webkit-backdrop-filter: blur(26px); backdrop-filter: blur(26px);
    }
    .panic-overlay[hidden] { display: none; }
    .panic-card { width: 100%; max-width: 520px; text-align: center; animation: slideUpFade .5s var(--ease) both; }
    .panic-eyebrow {
      font-size: 12px; font-weight: 800; letter-spacing: .12em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .panic-title { font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin-bottom: 12px; }
    .panic-sub { color: var(--text-2); font-size: 15.5px; font-weight: 500; line-height: 1.65; text-wrap: pretty; }
    /* box breathing: expand (in) → hold → contract (out) → hold, 4s each */
    .panic-breath { display: flex; flex-direction: column; align-items: center; gap: 20px; margin: 30px 0 6px; }
    .panic-ring {
      width: 150px; height: 150px; border-radius: 50%;
      background: color-mix(in oklab, var(--accent) 13%, transparent);
      border: 2px solid color-mix(in oklab, var(--accent) 55%, transparent);
      box-shadow: 0 0 60px -18px color-mix(in oklab, var(--accent) 70%, transparent);
      animation: panicBreathe 16s var(--ease-soft) infinite;
    }
    @keyframes panicBreathe {
      0%   { transform: scale(.66); }
      25%  { transform: scale(1); }
      50%  { transform: scale(1); }
      75%  { transform: scale(.66); }
      100% { transform: scale(.66); }
    }
    .panic-phase { font-size: 15px; font-weight: 700; color: var(--text-2); }
    .panic-phase-count { color: var(--accent); font-weight: 800; margin-left: 9px; font-variant-numeric: tabular-nums; }
    .panic-ground { margin: 26px 0 4px; }
    .panic-ground-count {
      font-size: 64px; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .panic-ground-sense {
      font-size: 12px; font-weight: 800; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted); margin-top: 6px;
    }
    .panic-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    @media (prefers-reduced-motion: reduce) {
      .panic-ring { animation: none; transform: scale(.85); }
    }
  </style>
</head>
<body>
  <!-- animated background (orbs / waves / particles / stars / ripple / smoke) — built by blocked.js -->
  <div class="bg" aria-hidden="true">
    <div class="bg-veil"></div>
  </div>

  <div class="blocked-card">
    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      Protection Active
    </div>

    <div class="shield">
      <img src="icons/icon128.png" alt="Oath Light">
    </div>
    <h1>Take a deep breath</h1>
    <div class="reason" id="reason">This page was blocked to help you stay focused on your goals.</div>

    <div class="quote" id="quote" title="Tap for another">
      <div class="quote-mark" aria-hidden="true">&ldquo;</div>
      <div class="quote-text" id="quoteText"></div>
      <div class="quote-author" id="quoteAuthor"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-ico">
          <svg class="svgi" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <div class="stat-value" id="totalBlocks">0</div>
        <div class="stat-label">Sites Blocked</div>
      </div>
      <div class="stat">
        <div class="stat-ico">
          <svg class="svgi" viewBox="0 0 24 24"><path d="M12 3c1 3-1.5 4.5-1.5 7a1.5 1.5 0 003 0c0-.8-.3-1.4-.3-1.4 2 1.4 3.3 3.6 3.3 6.1a6.5 6.5 0 11-13 0C3.5 11 7 9 7.5 5.5 9.5 7 10 4.5 12 3z"/></svg>
        </div>
        <div class="stat-value" id="daysClean">0</div>
        <div class="stat-label">Days Protected</div>
      </div>
    </div>

    <div class="message">
      You're making progress. Every time you see this page, you're choosing growth over impulse.
    </div>

    <button class="btn btn-primary safe-btn" id="goBackBtn">
      <svg class="svgi" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Return to Safety
    </button>
    <br>
    <button class="btn btn-ghost safe-btn panic-btn" id="panicBtn">
      <svg class="svgi" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      I need help right now
    </button>
  </div>

  <!-- Panic / SOS urge-surfing flow (plan 5.1): box breathing → the
       20-minute-wave message → 5-4-3-2-1 grounding → redirect target.
       Self-contained fallback — runs right here even without the desktop
       app; blocked.js also deep-links the desktop flow when connected. -->
  <div class="panic-overlay" id="panicOverlay" hidden>
    <div class="panic-card">
      <div class="panic-eyebrow" id="panicEyebrow">You're safe here</div>
      <h2 class="panic-title" id="panicTitle">Let's breathe first.</h2>
      <p class="panic-sub" id="panicSub"></p>
      <div class="panic-breath" id="panicBreath">
        <div class="panic-ring" aria-hidden="true"></div>
        <div class="panic-phase"><span id="panicPhaseLabel">Breathe in</span><span class="panic-phase-count" id="panicPhaseCount">1</span></div>
      </div>
      <div class="panic-ground" id="panicGroundBox" hidden>
        <div class="panic-ground-count" id="panicGroundCount">5</div>
        <div class="panic-ground-sense" id="panicGroundSense">see</div>
      </div>
      <div class="panic-actions">
        <button class="btn btn-primary" id="panicGoBtn" hidden>Take me somewhere good</button>
        <button class="btn btn-ghost" id="panicNextBtn">Continue</button>
      </div>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
