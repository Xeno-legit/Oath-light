<!DOCTYPE html>
<html lang="en" data-theme="dark" data-style="aurora">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oath Light</title>
  <link rel="stylesheet" href="popup_assets/tokens.css">
  <link rel="stylesheet" href="popup_assets/popup.css">
  <style>
    /* Extension popup: render the panel directly (no faux browser chrome). */
    html, body { height: auto; overflow: visible; background: var(--bg-0); }
    body { width: 380px; }
    .popup { border-radius: 0; border: none; box-shadow: none; width: 380px; }
    /* shared stroke styling for the inline icons */
    .popup svg.ico { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    #blockMsg { font-size: 12px; font-weight: 600; min-height: 14px; padding: 0 2px; }
    .protect { cursor: default; } /* status banner, not interactive */
  </style>
</head>

<body>
  <div class="popup" id="popup">
    <div class="bg">
      <div class="bg-orb o1"></div>
      <div class="bg-orb o2"></div>
      <div class="bg-orb o3"></div>
      <div class="bg-veil"></div>
    </div>

    <div class="popup-inner">
      <!-- header -->
      <div class="pp-head">
        <div class="pp-logo"><img src="popup_assets/logo.png" alt="Oath Light"></div>
        <div style="min-width:0">
          <div class="pp-name">Oath Light</div>
          <div class="pp-ver" id="ppVer">Version</div>
        </div>
      </div>

      <!-- protection status (always on — not a toggle) -->
      <div class="protect" role="status">
        <span class="protect-knob" aria-hidden="true"></span>
        <!-- Voice-bound copy (UX Direction §2): voice-sync.js repaints every
             `data-ol-str` node on load and whenever the voice/Serious Mode
             flips. Inline text is the no-JS fallback. -->
        <span class="protect-label">
          <b data-ol-str="popup.protection_on">Protection On</b>
          <span data-ol-str="popup.protection_sub">Actively filtering this browser</span>
        </span>
        <span class="protect-spacer" aria-hidden="true"></span>
      </div>

      <!-- stats -->
      <div class="stat-row">
        <div class="stat">
          <div class="stat-ico"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" /><path d="M9 12l2 2 4-4" /></svg></div>
          <div class="stat-num" id="statBlocked">0</div>
          <div class="stat-lbl" data-ol-str="popup.stat_blocked_label">Sites Blocked</div>
        </div>
        <div class="stat">
          <div class="stat-ico"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3c1 3-1.5 4.5-1.5 7a1.5 1.5 0 003 0c0-.8-.3-1.4-.3-1.4 2 1.4 3.3 3.6 3.3 6.1a6.5 6.5 0 11-13 0C3.5 11 7 9 7.5 5.5 9.5 7 10 4.5 12 3z" /></svg></div>
          <div class="stat-num" id="statStreak">0</div>
          <div class="stat-lbl" data-ol-str="popup.stat_streak_label">Day Streak</div>
        </div>
      </div>

      <!-- quote -->
      <div class="quote" id="quote" title="Tap for another">
        <div class="quote-mark" aria-hidden="true">&ldquo;</div>
        <div class="quote-body">
          <div class="quote-text" id="quoteText"></div>
          <div class="quote-author" id="quoteAuthor"></div>
        </div>
      </div>

      <!-- block input -->
      <div class="block-row">
        <input class="input" id="blockInput" placeholder="Enter URL to block" autocomplete="off" spellcheck="false"
               data-ol-str="popup.block_input_placeholder" data-ol-str-attr="placeholder">
        <button class="btn btn-primary" id="blockBtn">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg> <span data-ol-str="popup.block_button">Block</span>
        </button>
      </div>
      <div id="blockMsg"></div>

      <!-- My Blocklist — opens the full manager page -->
      <button class="blocklist-btn" id="openManagerRow">
        <svg class="ico bl-ico" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12" /><circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none" /><circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none" /><circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none" /></svg>
        <span data-ol-str="popup.open_manager">My Blocklist</span>
        <svg class="ico bl-chev" viewBox="0 0 24 24" style="margin-left:auto"><path d="M9 6l6 6-6 6" /></svg>
      </button>

      <!-- footer -->
      <div class="pp-foot" id="ppFoot">
        <span class="live"></span>
        <span id="footText">Synced</span>
      </div>
    </div>
  </div>

  <script src="theme-sync.js"></script>
  <script src="strings.js"></script>
  <script src="voice-sync.js"></script>
  <script src="popup.js"></script>
</body>

</html>
