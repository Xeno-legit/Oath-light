# .github/workflows/ci.yml — the A.4 baseline CI skeleton (plan item A.4).
# Every later trust feature (OTA signing 3.5, reproducible builds 6.2, the
# community list pipeline 3.6) hangs off adding a job here. The whole point of
# A.1's workspace restructure is that `cargo test --workspace` covers core,
# app, guardian, native-host, and dns in one command.
#
# NOTE: CI runners CAN run cargo — the "never run cargo" rule in the repo is
# specific to the constrained local dev environment where cargo hangs. Here the
# Rust jobs are the primary compile gate the local workflow can't provide.
name: CI

on:
  push:
    # `pre-alpha/**` is here because the active release branch is
    # `pre-alpha/release` — without it, CI silently did not run on the branch
    # all the work was happening on.
    branches: [main, 'phase*/**', 'pre-alpha/**']
  pull_request:
    branches: [main]

jobs:
  extension-tests:
    name: Extension JS suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the extension test suite
        run: node extension/tests/run-all.cjs

  blocklist-shape:
    name: Blocklist JSON shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate blocklist JSON shape (valid JSON, lowercase domains)
        run: node scripts/ci/validate-blocklists.mjs

  design-system-sync:
    name: Design-system copies in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # tokens.css / strings.js are copied verbatim into each surface (no build
      # step anywhere). This fails the build the moment a copy is hand-edited
      # instead of the design-system source — see UX Direction §5.
      - name: Check every surface copy matches design-system/
        run: node scripts/ci/check-design-system-sync.mjs

  locales:
    name: Locale tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Separate concern from the sync gate above: that one proves the locale
      # files are copied verbatim to every surface, this one proves their
      # contents are usable — placeholders intact, no keys that the English
      # base no longer has, both voices present. A translated `{days}` is the
      # failure this exists to catch.
      - name: Validate locale tables against the English base
        run: node scripts/ci/check-locales.mjs

  renderer-transpile:
    name: Renderer transpiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The renderer is transpiled in the browser at runtime, so a syntax error
      # in a page file is otherwise invisible until someone opens that page.
      - name: Parse every renderer script with the shipped babel-standalone
        run: node desktop-app/scripts/check-renderer-transpile.mjs

  rust:
    name: Rust workspace (test + clippy)
    # The workspace has Windows-only deps (tauri, the windows crate, the DNS
    # adapter takeover) — build/test on Windows so those cfg blocks compile.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `stable` (ROADMAP: "pin toolchains"). A floating channel
      # means a Rust release can turn a green branch red overnight with no
      # commit of ours in between, and it makes the compiler an untracked
      # build input. 1.96.0 is what the workspace is developed against; the
      # crates' own `rust-version` floor is 1.77.2. Bump this deliberately.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app
      # tauri-build's build script fails if the externalBin sidecars are not
      # already staged under src-tauri/binaries, so build them first.
      - name: Stage Tauri sidecar binaries
        run: node desktop-app/scripts/bundle-sidecars.mjs
      - name: cargo test (whole workspace)
        run: cargo test --workspace --manifest-path desktop-app/Cargo.toml
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --manifest-path desktop-app/Cargo.toml -- -D warnings
