<meta charset="utf-8">
<style>
@font-face{font-family:'Manrope';font-style:normal;font-weight:200 800;src:url('m.woff2') format('woff2');}
html,body{margin:0;padding:0;background:#0a0a0a;}
.tile{
  width:440px;height:280px;box-sizing:border-box;background:#0a0a0a;
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color:#f2f2f2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 34px;
}
.row{display:flex;align-items:center;gap:13px;}
.mark{width:50px;height:50px;border-radius:13px;display:block;}
.name{font-size:29px;font-weight:800;letter-spacing:-.022em;line-height:1;}
h1{margin:26px 0 0;font-size:25px;font-weight:800;line-height:1.18;letter-spacing:-.025em;}
h1 span{color:#b8b8b8;}
.rule{width:44px;height:1px;background:rgba(255,255,255,.16);margin:18px 0 0;}
p{margin:15px 0 0;font-size:13px;line-height:1.45;color:#b8b8b8;letter-spacing:-.005em;}
.eyebrow{margin-top:18px;font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#7a7a7a;}
</style>
<div class="tile">
  <div class="row">
    <img class="mark" src="logo.png">
    <div class="name">Oath Light</div>
  </div>
  <h1>A clean path,<br><span>on your terms.</span></h1>
  <div class="rule"></div>
  <p>Blocks explicit content — and makes the protection hold.</p>
  <div class="eyebrow">Free &amp; open source · No accounts · No telemetry</div>
</div>
